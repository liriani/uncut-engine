<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Tag - Bottom Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #d1d1d1;
            overflow-x: hidden;
            cursor: crosshair;
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
        }

        .parallax-container {
            position: relative;
            min-height: 220vh;
        }

        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120%;
            background-image: url('https://images.unsplash.com/photo-1525114183042-88d447209772?q=80&w=2670&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(0.25) contrast(1.5) grayscale(0.5);
            will-change: transform;
            z-index: -1;
        }

        .graffiti-path {
            fill: none;
            stroke: #000000;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.9));
            transition: stroke-width 0.2s ease;
        }

        .drip {
            fill: #000000;
            opacity: 0;
            transform-origin: top;
            transform: scaleY(0);
            transition: transform 2.5s cubic-bezier(0.1, 0.5, 0.1, 1), opacity 0.5s;
        }

        .drip.active {
            opacity: 1;
        }

        .tag-font { font-family: 'Permanent Marker', cursive; }

        /* Multi-tier Engine UI */
        .engine-interface {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
            pointer-events: none;
        }

        /* ── Responsive: on small screens isolate engine below canvas ── */
        @media (max-width: 768px) {
            .engine-interface {
                position: relative;
                bottom: auto;
                left: auto;
                padding-bottom: 0;
                background: rgba(10, 10, 10, 0.97);
                border-top: 1px solid rgba(255,255,255,0.07);
                z-index: 100;
            }

            /* Canvas section shrinks to give room to the panel */
            .mobile-canvas-section {
                height: 45vh !important;
                min-height: 200px;
            }

            /* Tabs wrap on mobile */
            .node-tabs {
                flex-wrap: wrap;
                gap: 0.4rem;
                padding: 8px;
            }

            .node-tab {
                border-radius: 0.4rem;
                border-bottom: 1px solid rgba(255,255,255,0.08);
            }

            .node-panel {
                border-radius: 0.6rem;
                margin: 0 8px 8px;
                width: calc(95% - 16px);
            }

            .node-panel-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .node-panel-extra {
                grid-template-columns: repeat(2, 1fr);
            }

            /* Master dock stacks vertically on mobile */
            .master-dock {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
                border-radius: 0;
                box-shadow: none;
                width: 100%;
                max-width: 100%;
            }

            .master-dock .grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            /* Hide parallax scroll hint on mobile — not needed */
            .parallax-container {
                min-height: unset;
            }

            /* Sticky canvas wrapper becomes normal flow on mobile */
            .mobile-sticky-wrapper {
                position: relative !important;
                height: 45vh !important;
                top: auto !important;
            }
        }

        /* Node Selector Tabs */
        .node-tabs {
            width: 95%;
            max-width: 1200px;
            display: flex;
            gap: 0.5rem;
            padding: 8px 10px 0;
            pointer-events: auto;
        }

        .node-tab {
            padding: 0.4rem 1rem;
            background: rgba(15, 15, 15, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: none;
            border-radius: 0.6rem 0.6rem 0 0;
            font-size: 0.65rem;
            font-weight: 900;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            pointer-events: auto;
            flex-shrink: 0;
        }

        .node-tab:hover {
            background: rgba(25, 25, 25, 0.85);
            color: rgba(255,255,255,0.6);
            border-color: rgba(255,255,255,0.15);
        }

        .node-tab.is-active-tab {
            background: rgba(20, 20, 20, 0.98);
            color: #f43f5e;
            border-color: rgba(244, 63, 94, 0.4);
        }

        /* Contextual Settings Panel */
        .node-panel {
            width: 95%;
            max-width: 1200px;
            background: rgba(20, 20, 20, 0.98);
            border: 1px solid rgba(244, 63, 94, 0.25);
            border-radius: 0 0.6rem 0.6rem 0.6rem;
            padding: 1rem 1.25rem;
            pointer-events: auto;
            margin-bottom: 8px;
            display: none;
        }

        .node-panel.is-visible {
            display: block;
        }

        .node-panel-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1rem;
        }

        .node-panel-extra {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        /* Bottom Tier: Master Dock */
        .master-dock {
            width: 95%;
            max-width: 1200px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            gap: 3rem;
            box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        input[type=range] {
            accent-color: #f43f5e;
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            appearance: none;
        }

        .node-tab.is-hovered-tab {
            border-color: rgba(244, 63, 94, 0.2);
            color: rgba(255,255,255,0.5);
        }

        /* SVG Letter Hover Effects */
        .letter-group {
            transition: all 0.3s ease;
            cursor: crosshair;
        }

        .letter-group.is-hovered .graffiti-path,
        .letter-group:hover .graffiti-path {
            stroke: #f43f5e !important;
            filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.8)) !important;
            z-index: 10;
        }

        .letter-group.is-hovered .drip,
        .letter-group:hover .drip {
            fill: #f43f5e !important;
        }

        .label-text {
            font-size: 0.6rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .value-text {
            font-size: 0.65rem;
            font-family: monospace;
            color: #f43f5e;
        }

        #graffiti-svg {
            filter: url(#rough-filter);
            overflow: visible;
        }

        #custom-cursor {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

<svg style="position: absolute; width: 0; height: 0;">
    <defs>
        <filter id="rough-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" id="displace-map" scale="4" />
        </filter>
    </defs>
</svg>

<div id="custom-cursor"></div>

<div class="parallax-container">
    <div class="parallax-bg" id="parallax-bg"></div>

    <div class="content-layer">
        <section class="h-screen flex flex-col items-center justify-center relative">
            <div class="text-center">
                <h1 class="text-9xl font-black tag-font text-white opacity-10 blur-sm absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none uppercase">UNCUT</h1>
                <p class="text-gray-500 uppercase tracking-[1em] text-xs font-bold">Scroll to Spray</p>
            </div>
        </section>

        <main class="relative min-h-[100vh] flex items-center justify-center mobile-canvas-section">
            <div class="sticky top-0 h-screen flex items-center justify-center w-full mobile-sticky-wrapper">
                <svg id="graffiti-svg" viewBox="0 0 900 600" class="w-full max-w-6xl px-4">
                    <!-- U1 -->
                    <g id="letter-U1" class="letter-group">
                        <path class="graffiti-path" d="M100,150 Q100,320 180,320 Q260,320 260,150" />
                        <rect class="drip" x="105" y="270" width="5" height="170" rx="2" />
                        <rect class="drip" x="240" y="250" width="6" height="130" rx="3" />
                        <rect class="drip extra-drip" data-drip-idx="0" data-enabled="false" x="155" y="310" width="4" height="90" rx="2" />
                        <rect class="drip extra-drip" data-drip-idx="1" data-enabled="false" x="195" y="300" width="7" height="150" rx="3.5" />
                        <rect class="drip extra-drip" data-drip-idx="2" data-enabled="false" x="220" y="280" width="3" height="110" rx="1.5" />
                    </g>
                    <!-- N -->
                    <g id="letter-N" class="letter-group">
                        <path class="graffiti-path" d="M300,320 L300,150 L380,320 L380,150" />
                        <rect class="drip" x="296" y="290" width="7" height="280" rx="3.5" />
                        <rect class="drip" x="376" y="290" width="5" height="200" rx="2.5" />
                        <rect class="drip extra-drip" data-drip-idx="0" data-enabled="false" x="310" y="300" width="4" height="120" rx="2" />
                        <rect class="drip extra-drip" data-drip-idx="1" data-enabled="false" x="340" y="260" width="6" height="180" rx="3" />
                        <rect class="drip extra-drip" data-drip-idx="2" data-enabled="false" x="360" y="310" width="3" height="95" rx="1.5" />
                    </g>
                    <!-- C -->
                    <g id="letter-C" class="letter-group">
                        <path class="graffiti-path" d="M480,180 Q420,150 420,240 Q420,330 480,300" />
                        <rect class="drip" x="430" y="290" width="5" height="260" rx="2.5" />
                        <rect class="drip extra-drip" data-drip-idx="0" data-enabled="false" x="445" y="310" width="4" height="140" rx="2" />
                        <rect class="drip extra-drip" data-drip-idx="1" data-enabled="false" x="460" y="280" width="6" height="200" rx="3" />
                        <rect class="drip extra-drip" data-drip-idx="2" data-enabled="false" x="422" y="260" width="3" height="100" rx="1.5" />
                    </g>
                    <!-- U2 -->
                    <g id="letter-U2" class="letter-group">
                        <path class="graffiti-path" d="M510,150 Q510,320 590,320 Q670,320 670,150" />
                        <rect class="drip" x="512" y="270" width="6" height="200" rx="3" />
                        <rect class="drip" x="588" y="310" width="5" height="280" rx="2.5" />
                        <rect class="drip extra-drip" data-drip-idx="0" data-enabled="false" x="540" y="305" width="4" height="130" rx="2" />
                        <rect class="drip extra-drip" data-drip-idx="1" data-enabled="false" x="565" y="295" width="7" height="170" rx="3.5" />
                        <rect class="drip extra-drip" data-drip-idx="2" data-enabled="false" x="620" y="270" width="3" height="110" rx="1.5" />
                    </g>
                    <!-- T -->
                    <g id="letter-T" class="letter-group">
                        <path class="graffiti-path" d="M670,150 L780,150 M725,150 L725,320" />
                        <rect class="drip" x="723" y="290" width="8" height="370" rx="4" />
                        <rect class="drip" x="770" y="160" width="6" height="440" rx="3" />
                        <rect class="drip extra-drip" data-drip-idx="0" data-enabled="false" x="695" y="155" width="4" height="120" rx="2" />
                        <rect class="drip extra-drip" data-drip-idx="1" data-enabled="false" x="745" y="300" width="5" height="160" rx="2.5" />
                        <rect class="drip extra-drip" data-drip-idx="2" data-enabled="false" x="758" y="155" width="3" height="90" rx="1.5" />
                    </g>
                    <!-- Underline -->
                    <g id="letter-Under" class="letter-group">
                        <path class="graffiti-path" d="M250,392 C350,342 550,342 650,392" />
                        <rect class="drip" x="450" y="370" width="5" height="130" rx="2.5" />
                        <rect class="drip extra-drip" data-drip-idx="0" data-enabled="false" x="320" y="360" width="4" height="100" rx="2" />
                        <rect class="drip extra-drip" data-drip-idx="1" data-enabled="false" x="390" y="355" width="6" height="150" rx="3" />
                        <rect class="drip extra-drip" data-drip-idx="2" data-enabled="false" x="560" y="365" width="3" height="85" rx="1.5" />
                    </g>
                </svg>
            </div>
        </main>

        <section class="h-screen flex items-center justify-center">
            <p class="tag-font text-xl text-white/5 uppercase tracking-widest">End of Session</p>
        </section>
    </div>
</div>

<!-- Engine Interface — after canvas so mobile flow puts it below -->
<div class="engine-interface">
    <!-- Letter Selector Tabs -->
    <div id="node-tabs" class="node-tabs"></div>

    <!-- Contextual Node Settings Panel -->
    <div id="node-panel" class="node-panel"></div>

    <!-- Master Controller (Bottom Tier) -->
    <div class="master-dock">
        <div class="flex flex-col flex-shrink-0 gap-1">
            <span class="text-[11px] font-black text-rose-500 uppercase tracking-tighter italic">Engine Master</span>
            <button id="reset-btn" class="text-[9px] text-gray-500 hover:text-white underline text-left">RESET SYSTEM</button>
            <button id="export-btn" class="text-[9px] text-rose-500/70 hover:text-rose-400 border border-rose-500/30 hover:border-rose-400/60 rounded px-2 py-0.5 uppercase tracking-tighter transition-all">⬇ Export SVG</button>
        </div>

        <div class="flex-1 grid grid-cols-3 gap-8">
            <div class="space-y-1">
                <div class="flex justify-between mb-1"><span class="label-text">Spacing</span><span class="value-text" id="v-master-spacing">0</span></div>
                <input type="range" id="master-spacing" min="-40" max="80" value="0">
            </div>
            <div class="space-y-1">
                <div class="flex justify-between mb-1"><span class="label-text">Roughness</span><span class="value-text" id="v-master-rough">4</span></div>
                <input type="range" id="master-rough" min="0" max="30" value="4">
            </div>
            <div class="space-y-1">
                <div class="flex justify-between mb-1"><span class="label-text">Global Weight</span><span class="value-text" id="v-master-weight">36</span></div>
                <input type="range" id="master-weight" min="5" max="100" value="36">
            </div>
        </div>
    </div>
</div>

<script>
    const letterIds = ['U1', 'N', 'C', 'U2', 'T', 'Under'];
    const state = {
        master: { spacing: 0, weight: 36, rough: 4 },
        letters: {}
    };

    const extraDripLabels = ['A', 'B', 'C'];

    letterIds.forEach(id => {
        state.letters[id] = { weight: 36, height: 1.0, width: 1.0, skew: 0, offset: 0, dripScale: 1.0, extraDrips: [false, false, false], extraDripScale: [1.0, 1.0, 1.0] };
    });


    let selectedNodeId = null;

    function renderPanel(id) {
        const panel = document.getElementById('node-panel');
        if (!id) { panel.classList.remove('is-visible'); panel.innerHTML = ''; return; }
        const conf = state.letters[id];
        panel.innerHTML = `
            <div class="node-panel-grid">
                <div>
                    <label class="label-text flex justify-between mb-1">Weight <span class="value-text" id="v-w-${id}">${conf.weight}</span></label>
                    <input type="range" class="eng-input" data-id="${id}" data-type="weight" min="5" max="100" value="${conf.weight}">
                </div>
                <div>
                    <label class="label-text flex justify-between mb-1">Height <span class="value-text" id="v-h-${id}">${conf.height.toFixed(1)}</span></label>
                    <input type="range" class="eng-input" data-id="${id}" data-type="height" min="0.5" max="1.8" step="0.1" value="${conf.height}">
                </div>
                <div>
                    <label class="label-text flex justify-between mb-1">Width <span class="value-text" id="v-wi-${id}">${conf.width.toFixed(1)}</span></label>
                    <input type="range" class="eng-input" data-id="${id}" data-type="width" min="0.3" max="2.5" step="0.1" value="${conf.width}">
                </div>
                <div>
                    <label class="label-text flex justify-between mb-1">Drip <span class="value-text" id="v-d-${id}">${conf.dripScale.toFixed(1)}</span></label>
                    <input type="range" class="eng-input" data-id="${id}" data-type="dripScale" min="0" max="3" step="0.1" value="${conf.dripScale}">
                </div>
                <div>
                    <label class="label-text flex justify-between mb-1">Skew <span class="value-text" id="v-sk-${id}">${conf.skew}</span></label>
                    <input type="range" class="eng-input" data-id="${id}" data-type="skew" min="-30" max="30" value="${conf.skew}">
                </div>
                <div>
                    <label class="label-text flex justify-between mb-1">Offset <span class="value-text" id="v-of-${id}">${conf.offset}</span></label>
                    <input type="range" class="eng-input" data-id="${id}" data-type="offset" min="-80" max="120" value="${conf.offset}">
                </div>
            </div>
            <div class="node-panel-extra">
                ${extraDripLabels.map((lbl, i) => `
                <div>
                    <div class="flex items-center gap-1.5 mb-1">
                        <button class="extra-drip-toggle text-[8px] px-1.5 py-0.5 rounded border transition-all ${conf.extraDrips[i] ? 'border-rose-500/60 text-rose-400' : 'border-white/10 text-gray-500 hover:border-rose-500/50 hover:text-rose-400'}" data-id="${id}" data-idx="${i}">Drip ${lbl}</button>
                        <span class="value-text" id="v-ed-${id}-${i}">${conf.extraDrips[i] ? conf.extraDripScale[i].toFixed(1) : 'off'}</span>
                    </div>
                    <input type="range" class="extra-drip-scale" data-id="${id}" data-idx="${i}" min="0" max="3" step="0.1" value="${conf.extraDripScale[i]}" style="opacity:${conf.extraDrips[i] ? '1' : '0.3'};pointer-events:${conf.extraDrips[i] ? 'auto' : 'none'};">
                </div>
                `).join('')}
            </div>
        `;
        panel.classList.add('is-visible');

        // Attach eng-input listeners
        panel.querySelectorAll('.eng-input').forEach(input => {
            input.addEventListener('input', (e) => {
                const { id: lid, type } = e.target.dataset;
                state.letters[lid][type] = parseFloat(e.target.value);
                applyEngineStyles();
            });
        });

        // Extra drip toggle
        panel.querySelectorAll('.extra-drip-toggle').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const { id: lid, idx } = e.target.dataset;
                const i = parseInt(idx);
                state.letters[lid].extraDrips[i] = !state.letters[lid].extraDrips[i];
                const on = state.letters[lid].extraDrips[i];
                btn.classList.toggle('border-rose-500/60', on);
                btn.classList.toggle('text-rose-400', on);
                btn.classList.toggle('border-white/10', !on);
                btn.classList.toggle('text-gray-500', !on);
                const scaleInput = panel.querySelector(`.extra-drip-scale[data-id="${lid}"][data-idx="${idx}"]`);
                if (scaleInput) { scaleInput.style.opacity = on ? '1' : '0.3'; scaleInput.style.pointerEvents = on ? 'auto' : 'none'; }
                const label = document.getElementById(`v-ed-${lid}-${i}`);
                if (label) label.innerText = on ? state.letters[lid].extraDripScale[i].toFixed(1) : 'off';
                applyEngineStyles();
            });
        });

        // Extra drip scale
        panel.querySelectorAll('.extra-drip-scale').forEach(input => {
            input.addEventListener('input', (e) => {
                const { id: lid, idx } = e.target.dataset;
                const i = parseInt(idx);
                state.letters[lid].extraDripScale[i] = parseFloat(e.target.value);
                const label = document.getElementById(`v-ed-${lid}-${i}`);
                if (label && state.letters[lid].extraDrips[i]) label.innerText = e.target.value;
                applyEngineStyles();
            });
        });
    }

    function buildEngineUI() {
        const tabsContainer = document.getElementById('node-tabs');
        tabsContainer.innerHTML = letterIds.map(id =>
            `<button class="node-tab" data-tab-id="${id}">${id}</button>`
        ).join('');

        const allTabs = tabsContainer.querySelectorAll('.node-tab');

        const selectTab = (targetId) => {
            allTabs.forEach(t => {
                const tId = t.dataset.tabId;
                const g = document.getElementById(`letter-${tId}`);
                if (tId === targetId) {
                    t.classList.add('is-active-tab');
                    if (g) g.classList.add('is-hovered');
                } else {
                    t.classList.remove('is-active-tab');
                    t.classList.remove('is-hovered-tab');
                    if (g) g.classList.remove('is-hovered');
                }
            });
            selectedNodeId = targetId;
            renderPanel(targetId);
        };

        const deselectAll = () => {
            allTabs.forEach(t => {
                t.classList.remove('is-active-tab');
                t.classList.remove('is-hovered-tab');
                const g = document.getElementById(`letter-${t.dataset.tabId}`);
                if (g) g.classList.remove('is-hovered');
            });
            selectedNodeId = null;
            renderPanel(null);
        };

        allTabs.forEach(tab => {
            const id = tab.dataset.tabId;
            tab.addEventListener('click', () => {
                if (selectedNodeId === id) deselectAll();
                else selectTab(id);
            });
        });

        // SVG letter hover/click wiring
        letterIds.forEach(id => {
            const svgGroup = document.getElementById(`letter-${id}`);
            const tab = tabsContainer.querySelector(`[data-tab-id="${id}"]`);
            if (!svgGroup || !tab) return;

            svgGroup.addEventListener('mouseenter', () => {
                if (selectedNodeId !== id) tab.classList.add('is-hovered-tab');
                svgGroup.classList.add('is-hovered');
            });
            svgGroup.addEventListener('mouseleave', () => {
                tab.classList.remove('is-hovered-tab');
                if (selectedNodeId !== id) svgGroup.classList.remove('is-hovered');
            });
            svgGroup.addEventListener('click', () => {
                if (selectedNodeId === id) deselectAll();
                else selectTab(id);
            });
        });
    }

    function applyEngineStyles() {
        document.getElementById('displace-map').setAttribute('scale', state.master.rough);

        letterIds.forEach((id, index) => {
            const group = document.getElementById(`letter-${id}`);
            const path = group.querySelector('.graffiti-path');
            const drips = group.querySelectorAll('.drip');
            const conf = state.letters[id];

            // Apply Master Spacing + per-letter offset
            const xBase = index * state.master.spacing + (conf.offset || 0);

            // Apply Transforms
            group.style.transform = `translateX(${xBase}px) scaleX(${conf.width || 1.0}) scaleY(${conf.height}) skewX(${conf.skew || 0}deg)`;
            group.style.transformOrigin = 'center 150px';

            path.style.strokeWidth = conf.weight;

            drips.forEach(d => {
                if (d.classList.contains('extra-drip')) {
                    const idx = parseInt(d.dataset.dripIdx);
                    const enabled = conf.extraDrips[idx];
                    const scale = conf.extraDripScale[idx];
                    d.style.setProperty('--target-scale', enabled ? scale : 0);
                    if (enabled) {
                        d.style.opacity = '1';
                        if (d.classList.contains('active')) d.style.transform = `scaleY(${scale})`;
                    } else {
                        d.style.opacity = '0';
                        d.style.transform = 'scaleY(0)';
                    }
                } else {
                    d.style.setProperty('--target-scale', conf.dripScale);
                    if (d.classList.contains('active')) {
                        d.style.transform = `scaleY(${conf.dripScale})`;
                    }
                }
            });

            // Update Labels
            if (id === selectedNodeId) {
                const vh = document.getElementById(`v-h-${id}`); if(vh) vh.innerText = conf.height.toFixed(1);
                const vw = document.getElementById(`v-w-${id}`); if(vw) vw.innerText = conf.weight;
                const vwi = document.getElementById(`v-wi-${id}`); if(vwi) vwi.innerText = (conf.width || 1.0).toFixed(1);
                const vd = document.getElementById(`v-d-${id}`); if(vd) vd.innerText = conf.dripScale.toFixed(1);
                const vsk = document.getElementById(`v-sk-${id}`); if(vsk) vsk.innerText = conf.skew;
                const vof = document.getElementById(`v-of-${id}`); if(vof) vof.innerText = conf.offset || 0;
            }
        });
    }

    // Master Logic
    document.getElementById('master-spacing').addEventListener('input', (e) => {
        state.master.spacing = parseInt(e.target.value);
        document.getElementById('v-master-spacing').innerText = e.target.value;
        applyEngineStyles();
    });
    document.getElementById('master-rough').addEventListener('input', (e) => {
        state.master.rough = e.target.value;
        document.getElementById('v-master-rough').innerText = e.target.value;
        applyEngineStyles();
    });
    document.getElementById('master-weight').addEventListener('input', (e) => {
        state.master.weight = e.target.value;
        document.getElementById('v-master-weight').innerText = e.target.value;
        // Sync all letters to master weight for convenience
        letterIds.forEach(id => {
            state.letters[id].weight = parseFloat(e.target.value);
        });
        // Update the panel slider + label if a node is currently selected
        if (selectedNodeId) {
            const panelInput = document.querySelector(`#node-panel .eng-input[data-type="weight"]`);
            if (panelInput) panelInput.value = e.target.value;
            const panelLabel = document.getElementById(`v-w-${selectedNodeId}`);
            if (panelLabel) panelLabel.innerText = e.target.value;
        }
        applyEngineStyles();
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
        location.reload();
    });

    document.getElementById('export-btn').addEventListener('click', () => {
        const sourceSvg = document.getElementById('graffiti-svg');
        const clone = sourceSvg.cloneNode(true);

        // Inline computed styles for paths and drips so the export is self-contained
        const sourceEls = sourceSvg.querySelectorAll('path, rect, g');
        const cloneEls  = clone.querySelectorAll('path, rect, g');
        sourceEls.forEach((el, i) => {
            const computed = window.getComputedStyle(el);
            const relevant = ['stroke', 'stroke-width', 'stroke-dasharray', 'stroke-dashoffset',
                              'fill', 'opacity', 'transform', 'transform-origin', 'filter'];
            relevant.forEach(prop => {
                const val = computed.getPropertyValue(prop);
                if (val && val !== '') cloneEls[i].style[prop] = val;
            });
        });

        // Embed the rough filter defs into the clone
        const defsSource = document.querySelector('svg defs');
        if (defsSource) {
            const defsClone = defsSource.cloneNode(true);
            clone.insertBefore(defsClone, clone.firstChild);
        }

        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        clone.removeAttribute('class');

        const svgData = new XMLSerializer().serializeToString(clone);
        const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'uncut-tag.svg';
        a.click();
        URL.revokeObjectURL(url);
    });

    function initScrollEngine() {
        const paths = document.querySelectorAll('.graffiti-path');
        const parallaxBg = document.getElementById('parallax-bg');
        const cursor = document.getElementById('custom-cursor');

        paths.forEach(p => {
            const len = p.getTotalLength();
            p.style.strokeDasharray = len;
            p.style.strokeDashoffset = len;
        });

        const handleScroll = () => {
            const y = window.scrollY;
            const winH = window.innerHeight;

            parallaxBg.style.transform = `translate3d(0, ${y * 0.3}px, 0)`;

            const start = winH * 0.1;
            const end = winH * 0.9;
            let progress = (y - start) / (end - start);
            progress = Math.max(0, Math.min(1, progress));

            cursor.style.display = (progress > 0 && progress < 1) ? 'block' : 'none';

            paths.forEach(p => {
                const len = p.getTotalLength();
                p.style.strokeDashoffset = len * (1 - progress);
            });

            // Activate Drips
            if (progress > 0.85) {
                document.querySelectorAll('.drip').forEach((d, i) => {
                    if (d.classList.contains('extra-drip') && d.style.opacity === '0') return;
                    setTimeout(() => {
                        d.classList.add('active');
                        const scale = d.style.getPropertyValue('--target-scale') || 1;
                        d.style.transform = `scaleY(${scale})`;
                    }, i * 40);
                });
            } else {
                document.querySelectorAll('.drip').forEach(d => {
                    d.classList.remove('active');
                    if (!(d.classList.contains('extra-drip') && d.style.opacity === '0')) {
                        d.style.transform = `scaleY(0)`;
                    }
                });
            }
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX - 15 + 'px';
            cursor.style.top = e.clientY - 15 + 'px';
        });
    }

    window.onload = () => {
        buildEngineUI();
        applyEngineStyles();
        initScrollEngine();
    };
</script>
</body>
</html>
